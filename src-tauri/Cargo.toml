[package]
name = "tauri-git-editor"
version = "0.1.0"
description = "Minimalist Tauri Git Editor"
authors = ["Developer"]
edition = "2021"

[lib]
name = "tauri_git_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
