name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  determine-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${GITHUB_REF_NAME}" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)

          if [[ -z "${latest_tag}" ]]; then
            next_version="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"

            if (( minor < 9 )); then
              minor=$((minor + 1))
            else
              major=$((major + 1))
              minor=0
            fi

            next_version="v${major}.${minor}.0"
          fi

          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next_version}"

  build-tauri:
    needs: determine-version
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set application version from release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          APP_VERSION="${RELEASE_VERSION#v}"
          export APP_VERSION

          node <<'NODE'
          const fs = require('node:fs');

          const files = ['package.json', 'src-tauri/tauri.conf.json'];
          for (const file of files) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = process.env.APP_VERSION;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }

          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          const updated = cargo.replace(
            /(^\[package\][\s\S]*?^version\s*=\s*)"[^"]+"/m,
            `$1"${process.env.APP_VERSION}"`
          );

          if (updated === cargo) {
            throw new Error('Could not update version in src-tauri/Cargo.toml');
          }

          fs.writeFileSync(cargoPath, updated);
          console.log(`Application version set to ${process.env.APP_VERSION}`);
          NODE

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare frontend and default icon
        shell: bash
        run: |
          npm install
          mkdir -p dist src-tauri/icons
          cp index.html dist/index.html
          npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.determine-version.outputs.version }}
          releaseName: 'Git Editor ${{ needs.determine-version.outputs.version }}'
          releaseBody: 'Автоматическая сборка из GitHub Actions'
          releaseDraft: false
          prerelease: false
